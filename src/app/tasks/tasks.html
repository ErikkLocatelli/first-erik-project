@if (isAddingTask) {
    <app-new-tasks (cancel)="onCancelAddTask()" />
}
<section id="tasks">
    <header>
        <h2>{{name}}'s Tasks</h2>
    </header>
    <menu>
        <button (click)="onStartAddTask()">Add Task</button>
    </menu>
    <ul>
        <li *ngFor='let task of selectedUserTasks'>
            <app-task [task]="task" 
            (complete)="onCompleteTask($event)"
            /> 
        </li>
    </ul>
</section >
